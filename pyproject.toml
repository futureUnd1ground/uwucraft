[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "uwucraft"
version = "0.3.0"
description = "A quiet home for your Minecraft server. Native Linux and Windows server management."
readme = "README.md"
requires-python = ">=3.11.8"
license = "MIT"
dependencies = ["textual>=6.12,<7", "rich>=13", "httpx>=0.27", "typer>=0.15", "psutil>=6", "tomli-w>=1"]
[project.scripts]
uwucraft = "uwucraft.cli:main"
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9"]
[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
[tool.ruff]
target-version = "py311"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
