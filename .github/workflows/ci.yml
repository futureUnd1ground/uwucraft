name: quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest -q
      - run: uwucraft --help
      - run: python -m pip wheel . --no-deps -w dist
  windows:
    timeout-minutes: 15
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    env:
      UWUCRAFT_WINDOWS_INTEGRATION: '1'
      UWUCRAFT_WINDOWS_MINECRAFT: ${{ matrix.python == '3.14' && '1' || '0' }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest -v tests/test_windows.py tests/test_local_content.py tests/test_profiles.py tests/test_creation.py::test_tui_create_button_and_shared_backend tests/test_creation.py::test_quick_create_never_prompts tests/test_core.py::test_backup_restore tests/test_core.py::test_tui_pages_and_theme --basetemp="${{ runner.temp }}/uwucraft-tests"
        timeout-minutes: 8
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-logs-${{ matrix.python }}
          path: ${{ runner.temp }}/uwucraft-tests/**/*.log
          if-no-files-found: ignore
      - run: uwucraft --help
      - run: uwucraft create --quick --loader paper --port 25565 --accept-eula --start --dry-run
      - run: python -m pip wheel . --no-deps -w dist
      - name: Install with existing Python
        if: matrix.python != '3.14'
        run: ./install.ps1
      - name: Stage bundled Python payload and build Windows ZIP
        if: matrix.python == '3.14'
        run: |
          $manifest = Get-Content vendor/python-runtime.json -Raw | ConvertFrom-Json
          Invoke-WebRequest -Uri $manifest.url -OutFile vendor/python-installer.exe
          python scripts/package_windows.py --python-installer vendor/python-installer.exe
      - name: Bootstrap signed official Python and install uwucraft
        if: matrix.python == '3.14'
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./install.ps1 -BootstrapPython
      - name: Check installed launcher
        run: |
          & "$env:LOCALAPPDATA/uwucraft-app/uwucraft.cmd" --help
          if ($LASTEXITCODE -ne 0) { throw 'Installed launcher failed' }
