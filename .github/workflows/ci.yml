name: quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest -q
      - run: uwucraft --help
      - run: python -m pip wheel . --no-deps -w dist
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    env:
      UWUCRAFT_WINDOWS_INTEGRATION: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest -q tests/test_windows.py
      - run: uwucraft --help
      - run: uwucraft create --quick --loader paper --port 25565 --accept-eula --start --dry-run
      - run: python -m pip wheel . --no-deps -w dist
      - name: Install via native PowerShell installer
        run: ./install.ps1
